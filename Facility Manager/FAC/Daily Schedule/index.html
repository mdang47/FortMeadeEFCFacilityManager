<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAC Daily Schedule</title>

<style>

:root {
    --navy: #102b46;
    --light-blue: #bfeaff;
    --white: #ffffff;
    --panel: #ffffff;
    --text: #172536;
    --line: #d3dde6;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--navy);
}


/* =========================
   DISPLAY
========================= */

#displayView {
    min-height: 100vh;
    background: var(--navy);
    color: white;
    padding:
        18px
        25px
        30px;
}


.display-header {
    text-align: center;
}


.display-header h1 {
    margin: 0;

    color: var(--light-blue);

    font-size:
        clamp(
            26px,
            3vw,
            48px
        );

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.display-date {
    color: var(--light-blue);

    margin-top: 4px;

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    font-weight: bold;
}


/* =========================
   SCHEDULE GRID
========================= */

.schedule-grid {
    width: min(
        1000px,
        94vw
    );

    margin:
        28px
        auto
        0;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    column-gap: 90px;
    row-gap: 38px;

    align-items: start;
}


.schedule-block {
    text-align: center;
}


.schedule-time {
    color: var(--light-blue);

    font-size:
        clamp(
            30px,
            3vw,
            46px
        );

    line-height: 1;

    font-weight: 900;

    letter-spacing: 1px;
}


.schedule-cardio {
    color: var(--light-blue);

    font-size:
        clamp(
            19px,
            2vw,
            28px
        );

    font-weight: bold;

    margin-top: 6px;

    text-transform: uppercase;
}


.tester-list {
    margin-top: 20px;
}


.tester-name {
    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            15px,
            1.45vw,
            21px
        );

    line-height: 1.18;

    font-weight: 900;

    text-transform: uppercase;
}


.empty-message {
    text-align: center;

    color: var(--light-blue);

    margin-top: 80px;

    font-family:
        Arial,
        sans-serif;

    font-size: 20px;
}


/* =========================
   ADMIN BUTTON
========================= */

.admin-buttons {
    position: fixed;

    top: 10px;
    right: 10px;

    display: flex;
    gap: 6px;

    z-index: 20;

    opacity: .18;

    transition: opacity .2s;
}


.admin-buttons:hover {
    opacity: 1;
}


.admin-buttons button {
    border: 1px solid rgba(
        255,
        255,
        255,
        .4
    );

    background: rgba(
        255,
        255,
        255,
        .12
    );

    color: white;

    border-radius: 6px;

    padding: 7px 10px;

    cursor: pointer;

    font-family:
        Arial,
        sans-serif;

    font-size: 12px;
}


/* =========================
   EDIT VIEW
========================= */

#editView {
    display: none;

    min-height: 100vh;

    background: #f4f6f8;

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding:
        25px
        20px
        50px;
}


.editor {
    max-width: 1100px;
    margin: auto;
}


.editor h1 {
    margin-bottom: 5px;
}


.editor-subtitle {
    color: #657485;
    margin-bottom: 22px;
}


.editor-session {
    background: white;

    border-radius: 12px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px
        rgba(
            0,
            0,
            0,
            .08
        );
}


.session-top {
    display: grid;

    grid-template-columns:
        160px
        220px
        1fr
        auto;

    gap: 12px;

    align-items: end;
}


label {
    display: block;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 5px;
}


input,
select,
textarea {
    width: 100%;

    padding: 10px;

    border:
        1px solid
        #becad4;

    border-radius: 7px;

    font-size: 15px;

    font-family:
        Arial,
        sans-serif;
}


textarea {
    margin-top: 12px;

    min-height: 130px;

    resize: vertical;
}


.button-row {
    display: flex;
    gap: 10px;

    flex-wrap: wrap;

    margin-top: 18px;
}


button.action {
    border: none;

    border-radius: 8px;

    padding:
        11px
        17px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;
}


.primary {
    background: #163b61;
    color: white;
}


.secondary {
    background: #dde5eb;
    color: #172536;
}


.delete {
    background: #c94747;
    color: white;
}


/* =========================
   ROCKBOT MODE
========================= */

body.rockbot-mode
.admin-buttons {
    display: none;
}


/* =========================
   SMALL SCREEN
========================= */

@media
(max-width: 650px) {

    .schedule-grid {
        grid-template-columns:
            1fr;

        row-gap: 35px;
    }

    .session-top {
        grid-template-columns:
            1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     DISPLAY VIEW
========================= -->

<div id="displayView">


    <div class="admin-buttons">

        <button onclick="openEditor()">
            Edit
        </button>

        <button onclick="toggleRockbotMode()">
            Hide Controls
        </button>

        <button onclick="goHome()">
            FAC Home
        </button>

    </div>


    <div class="display-header">

        <h1>
            Today's Fitness Assessments
        </h1>

        <div
            class="display-date"
            id="displayDate">
        </div>

    </div>


    <div
        class="schedule-grid"
        id="scheduleGrid">
    </div>


    <div
        class="empty-message"
        id="emptyMessage"
        style="display:none;">
        No Fitness Assessments scheduled today.
    </div>


</div>


<!-- =========================
     EDIT VIEW
========================= -->

<div id="editView">

    <div class="editor">

        <h1>
            Daily Schedule
        </h1>

        <div class="editor-subtitle">
            Enter one tester per line.
        </div>


        <div id="sessionEditor">
        </div>


        <div class="button-row">

            <button
                class="action secondary"
                onclick="addSession()">
                + Add Session
            </button>

            <button
                class="action primary"
                onclick="saveSchedule()">
                Save Schedule
            </button>

            <button
                class="action secondary"
                onclick="closeEditor()">
                Cancel
            </button>

            <button
                class="action delete"
                onclick="clearSchedule()">
                Clear Today
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
    "facDailyScheduleV2";

const DATE_KEY =
    "facDailyScheduleDateV2";


/* =========================
   DATE
========================= */

function getTodayKey() {

    const date =
        new Date();

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function showDate() {

    const today =
        new Date();

    const formatted =
        today.toLocaleDateString(
            "en-GB",
            {
                weekday:
                    "long",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "2-digit"
            }
        );

    document
        .getElementById(
            "displayDate"
        )
        .textContent =
            formatted;

}


/* =========================
   DEFAULT SCHEDULE
========================= */

function defaultSchedule() {

    return [

        {
            time:
                "0730",

            cardio:
                "HAMR",

            testers: []
        },

        {
            time:
                "0900",

            cardio:
                "HAMR",

            testers: []
        },

        {
            time:
                "1030",

            cardio:
                "HAMR",

            testers: []
        },

        {
            time:
                "1300",

            cardio:
                "HAMR",

            testers: []
        }

    ];

}


/* =========================
   LOAD / SAVE
========================= */

function getSchedule() {

    const storedDate =
        localStorage.getItem(
            DATE_KEY
        );

    const today =
        getTodayKey();


    /*
       New day:
       automatically start fresh
    */

    if (
        storedDate &&
        storedDate !== today
    ) {

        localStorage.removeItem(
            STORAGE_KEY
        );

        localStorage.setItem(
            DATE_KEY,
            today
        );

    }


    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return defaultSchedule();

    }


    try {

        return JSON.parse(
            saved
        );

    }

    catch {

        return defaultSchedule();

    }

}


function setSchedule(
    schedule
) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            schedule
        )
    );

    localStorage.setItem(
        DATE_KEY,
        getTodayKey()
    );

}


/* =========================
   DISPLAY
========================= */

function renderSchedule() {

    const schedule =
        getSchedule();

    const grid =
        document.getElementById(
            "scheduleGrid"
        );

    const empty =
        document.getElementById(
            "emptyMessage"
        );


    grid.innerHTML = "";


    if (
        !schedule ||
        schedule.length === 0
    ) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    schedule.forEach(
        session => {

            const block =
                document.createElement(
                    "div"
                );

            block.className =
                "schedule-block";


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "schedule-time";

            time.textContent =
                session.time ||
                "";


            const cardio =
                document.createElement(
                    "div"
                );

            cardio.className =
                "schedule-cardio";

            cardio.textContent =
                session.cardio ||
                "";


            const testerList =
                document.createElement(
                    "div"
                );

            testerList.className =
                "tester-list";


            (
                session.testers ||
                []
            )
            .filter(
                name =>
                    name.trim()
            )
            .forEach(
                name => {

                    const tester =
                        document.createElement(
                            "div"
                        );

                    tester.className =
                        "tester-name";

                    tester.textContent =
                        name;

                    testerList.appendChild(
                        tester
                    );

                }
            );


            block.appendChild(
                time
            );

            block.appendChild(
                cardio
            );

            block.appendChild(
                testerList
            );


            grid.appendChild(
                block
            );

        }
    );

}


/* =========================
   EDITOR
========================= */

function openEditor() {

    document.getElementById(
        "displayView"
    ).style.display =
        "none";

    document.getElementById(
        "editView"
    ).style.display =
        "block";

    buildEditor();

}


function closeEditor() {

    document.getElementById(
        "editView"
    ).style.display =
        "none";

    document.getElementById(
        "displayView"
    ).style.display =
        "block";

}


function buildEditor() {

    const container =
        document.getElementById(
            "sessionEditor"
        );

    container.innerHTML =
        "";


    getSchedule().forEach(
        session => {

            addSession(
                session
            );

        }
    );

}


/* =========================
   ADD SESSION
========================= */

function addSession(
    data = {
        time: "",
        cardio: "HAMR",
        testers: []
    }
) {

    const container =
        document.getElementById(
            "sessionEditor"
        );


    const div =
        document.createElement(
            "div"
        );

    div.className =
        "editor-session";


    div.innerHTML = `

        <div class="session-top">

            <div>

                <label>
                    Time
                </label>

                <input
                    class="session-time"
                    type="text"
                    placeholder="0730"
                    value="${data.time || ""}"
                >

            </div>


            <div>

                <label>
                    Cardio
                </label>

                <select
                    class="session-cardio">

                    <option
                        value="HAMR"
                        ${
                            data.cardio ===
                            "HAMR"
                            ?
                            "selected"
                            :
                            ""
                        }>
                        HAMR
                    </option>

                    <option
                        value="2-Mile Run"
                        ${
                            data.cardio ===
                            "2-Mile Run"
                            ?
                            "selected"
                            :
                            ""
                        }>
                        2-Mile Run
                    </option>

                    <option
                        value="HAMR / 2-Mile Run"
                        ${
                            data.cardio ===
                            "HAMR / 2-Mile Run"
                            ?
                            "selected"
                            :
                            ""
                        }>
                        HAMR / 2-Mile Run
                    </option>

                </select>

            </div>


            <div></div>


            <button
                class="action delete"
                onclick="
                    this
                    .closest('.editor-session')
                    .remove()
                ">
                Remove
            </button>

        </div>


        <label
            style="margin-top:12px;">
            Tester Last Names
        </label>

        <textarea
            class="session-testers"
            placeholder="HINTON&#10;COLE&#10;SANTOS&#10;KILLILAY">${(
                data.testers ||
                []
            ).join(
                "\n"
            )}</textarea>

    `;


    container.appendChild(
        div
    );

}


/* =========================
   SAVE
========================= */

function saveSchedule() {

    const sessions =
        document.querySelectorAll(
            ".editor-session"
        );

    const schedule = [];


    sessions.forEach(
        session => {

            const time =
                session
                .querySelector(
                    ".session-time"
                )
                .value
                .trim();


            const cardio =
                session
                .querySelector(
                    ".session-cardio"
                )
                .value;


            const testerText =
                session
                .querySelector(
                    ".session-testers"
                )
                .value;


            const testers =
                testerText
                .split(
                    /\r?\n/
                )
                .map(
                    name =>
                        name.trim()
                )
                .filter(
                    Boolean
                );


            schedule.push({
                time,
                cardio,
                testers
            });

        }
    );


    setSchedule(
        schedule
    );

    renderSchedule();

    closeEditor();

}


/* =========================
   CLEAR
========================= */

function clearSchedule() {

    if (
        !confirm(
            "Clear today's schedule?"
        )
    ) {
        return;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );

    localStorage.setItem(
        DATE_KEY,
        getTodayKey()
    );


    setSchedule(
        defaultSchedule()
    );


    buildEditor();

    renderSchedule();

}


/* =========================
   ROCKBOT CONTROLS
========================= */

function toggleRockbotMode() {

    document.body
        .classList
        .toggle(
            "rockbot-mode"
        );

}


/* =========================
   FAC HOME
========================= */

function goHome() {

    window.location.href =
        "../index.html";

}


/* =========================
   INITIALIZE
========================= */

showDate();

renderSchedule();

</script>

</body>
</html>
