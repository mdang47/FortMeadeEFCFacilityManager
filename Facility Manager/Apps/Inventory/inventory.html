<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../inventory-manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="../Icons/Inventory.png">
<link rel="apple-touch-icon" href="../Icons/Inventory.png">

<title>Inventory</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.header {
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

.date {
    color: #666;
}


/* =========================
   SYNC STATUS
========================= */

.sync-status {
    text-align: center;
    margin-top: 8px;
    font-size: 13px;
    font-weight: bold;
}

.synced {
    color: #26834a;
}

.syncing {
    color: #a77e00;
}

.pending {
    color: #b36b00;
}

.offline {
    color: #c43d3d;
}


/* =========================
   SUMMARY
========================= */

.summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 800px;
    margin: 20px auto;
}

.summary-box {
    background: white;
    padding: 18px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.summary-number {
    font-size: 35px;
    font-weight: bold;
}

.summary-label {
    color: #666;
}


/* =========================
   SEARCH
========================= */

.search-container {
    max-width: 800px;
    margin: 20px auto 15px;
}

#search {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 18px;
}


/* =========================
   CATEGORY TABS
========================= */

.category-tabs {
    max-width: 800px;
    margin: 0 auto 20px;

    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    justify-content: center;
}

.tab {
    border: 2px solid transparent;

    padding: 10px 16px;

    border-radius: 20px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

.tab:active {
    transform: scale(.96);
}

.tab-all {
    background: #e5e5e5;
}

.tab-safety {
    background: #f5b7bd;
}

.tab-cleaning {
    background: #b8dff5;
}

.tab-office {
    background: #d5c4eb;
}

.tab-fitness {
    background: #bfe0bf;
}

.tab-facility {
    background: #f4c99b;
}

.tab-fac {
    background: #f3e49a;
}

.tab-other {
    background: #d5d5d5;
}

.tab.active {
    border-color: #333;
    box-shadow: 0 2px 5px rgba(0,0,0,.25);
}


/* =========================
   INVENTORY
========================= */

.inventory-list {
    max-width: 800px;
    margin: auto;
}

.item-card {
    padding: 18px;
    border-radius: 15px;
    margin-bottom: 12px;

    box-shadow:
    0 2px 6px rgba(0,0,0,.1);

    border-left: 8px solid #aaa;
}

.card-safety {
    background: #fff1f2;
    border-left-color: #dc7d87;
}

.card-cleaning {
    background: #eef8fd;
    border-left-color: #6bb8df;
}

.card-office {
    background: #f6f0fb;
    border-left-color: #9f7bc7;
}

.card-fitness {
    background: #f0f8f0;
    border-left-color: #72ae72;
}

.card-facility {
    background: #fff6eb;
    border-left-color: #dc9b54;
}

.card-fac {
    background: #fffbea;
    border-left-color: #d5bd42;
}

.card-other {
    background: #f4f4f4;
    border-left-color: #999;
}


/* =========================
   ITEM DETAILS
========================= */

.item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.item-name {
    font-size: 21px;
    font-weight: bold;
}

.category-label {
    color: #666;
    font-size: 14px;
    margin-top: 4px;
}

.minimum {
    color: #666;
    font-size: 14px;
    text-align: right;
}

.status {
    font-weight: bold;
    margin-top: 10px;
}

.in-stock {
    color: #26834a;
}

.low-stock {
    color: #c43d3d;
}


/* =========================
   QUANTITY
========================= */

.quantity-area {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 25px;

    margin-top: 15px;
}

.quantity-button {
    width: 58px;
    height: 58px;

    border: none;
    border-radius: 12px;

    font-size: 30px;

    background: rgba(255,255,255,.75);

    box-shadow:
    0 2px 5px rgba(0,0,0,.12);

    cursor: pointer;
}

.quantity-button:active {
    transform: scale(.94);
}

.quantity {
    font-size: 34px;
    font-weight: bold;
    min-width: 90px;
    text-align: center;
}

.unit {
    display: block;
    font-size: 12px;
    font-weight: normal;
    color: #666;
}


/* =========================
   ITEM ACTIONS
========================= */

.item-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
}

.small-button {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
}

.edit-button {
    background: rgba(255,255,255,.8);
}

.delete-button {
    background: #f4cccc;
    color: #8a1f1f;
}


/* =========================
   MAIN BUTTONS
========================= */

.action-area {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 10px;

    width: 100%;
    max-width: 800px;

    margin: 20px auto;
}

.add-button,
.sync-button {
    border: none;
    border-radius: 12px;

    padding: 17px;

    font-size: 18px;

    cursor: pointer;
}

.add-button {
    background: #333;
    color: white;
}

.sync-button {
    background: #dbe8f6;
    color: #222;
}


/* =========================
   EMPTY MESSAGE
========================= */

.empty-message {
    text-align: center;
    color: #777;
    background: white;

    padding: 30px;

    border-radius: 15px;
}


/* =========================
   MESSAGE
========================= */

.message {
    text-align: center;
    color: #666;
    font-size: 14px;
    min-height: 20px;

    max-width: 800px;
    margin: 0 auto;
}


/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    z-index: 1000;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,.5);

    padding: 20px;

    overflow-y: auto;
}

.modal-content {
    background: white;

    max-width: 500px;

    margin: 30px auto;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.25);
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;

    margin-bottom: 6px;

    font-weight: bold;
}

.form-group input,
.form-group select {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}

.form-buttons {
    display: grid;

    grid-template-columns:
    1fr 1fr;

    gap: 10px;

    margin-top: 20px;
}

.cancel-button,
.save-button {

    border: none;

    padding: 14px;

    border-radius: 9px;

    font-size: 16px;

    cursor: pointer;
}

.cancel-button {
    background: #ddd;
}

.save-button {
    background: #333;
    color: white;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .tab {
        padding: 9px 12px;
        font-size: 13px;
    }

    .quantity-area {
        gap: 15px;
    }

    .action-area {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="header">

<h1>Inventory</h1>

<div
class="date"
id="date">
</div>

<div
class="sync-status syncing"
id="syncStatus">
Loading...
</div>

</div>



<!-- SUMMARY -->

<div class="summary">

<div class="summary-box">

<div
class="summary-number"
id="totalItems">
0
</div>

<div class="summary-label">
Inventory Items
</div>

</div>


<div class="summary-box">

<div
class="summary-number"
id="lowStock">
0
</div>

<div class="summary-label">
Low Stock
</div>

</div>

</div>



<!-- SEARCH -->

<div class="search-container">

<input
type="text"
id="search"
placeholder="🔎 Search inventory..."
oninput="displayInventory()">

</div>

<div class="search-container">

    <select id="sortInventory"
            onchange="displayInventory()"
            style="
                width: 100%;
                padding: 13px;
                border: 1px solid #ccc;
                border-radius: 12px;
                font-size: 16px;
                background: white;
            ">

        <option value="category">
            Sort: Category + A–Z
        </option>

        <option value="low">
            Sort: Quantity Low → High
        </option>

        <option value="high">
            Sort: Quantity High → Low
        </option>

    </select>

</div>

<!-- CATEGORY TABS -->

<div class="category-tabs">

<button
class="tab tab-all active"
onclick="selectCategory('All', this)">
All
</button>

<button
class="tab tab-safety"
onclick="selectCategory('Safety', this)">
Safety
</button>

<button
class="tab tab-cleaning"
onclick="selectCategory('Cleaning', this)">
Cleaning
</button>

<button
class="tab tab-office"
onclick="selectCategory('Office', this)">
Office
</button>

<button
class="tab tab-fitness"
onclick="selectCategory('Fitness Equipment', this)">
Fitness
</button>

<button
class="tab tab-facility"
onclick="selectCategory('Facility', this)">
Facility
</button>

<button
class="tab tab-fac"
onclick="selectCategory('FAC', this)">
FAC
</button>

<button
class="tab tab-other"
onclick="selectCategory('Other', this)">
Other
</button>

</div>



<!-- INVENTORY -->

<div
class="inventory-list"
id="inventoryList">
</div>



<div class="action-area">

<button
class="add-button"
onclick="openAddForm()">

+ Add Inventory Item

</button>


<button
class="sync-button"
onclick="syncEverything()">

↻ Sync Now

</button>

</div>


<div
class="message"
id="message">
</div>



<!-- =====================
     ADD / EDIT MODAL
===================== -->

<div
class="modal"
id="itemModal">


<div class="modal-content">


<h2 id="modalTitle">
Add Inventory Item
</h2>


<div class="form-group">

<label>
Item Name
</label>

<input
type="text"
id="itemName"
placeholder="Example: Bandages">

</div>



<div class="form-group">

<label>
Category
</label>

<select id="itemCategory">

<option value="Safety">
Safety
</option>

<option value="Cleaning">
Cleaning
</option>

<option value="Office">
Office
</option>

<option value="Fitness Equipment">
Fitness Equipment
</option>

<option value="Facility">
Facility
</option>

<option value="FAC">
FAC
</option>

<option value="Other">
Other
</option>

</select>

</div>



<div class="form-group">

<label>
Current Quantity
</label>

<input
type="number"
id="itemQuantity"
min="0"
value="0">

</div>



<div class="form-group">

<label>
Unit
</label>

<select id="itemUnit">

<option value="Each">Each</option>
<option value="Boxes">Boxes</option>
<option value="Cases">Cases</option>
<option value="Packs">Packs</option>
<option value="Rolls">Rolls</option>
<option value="Bottles">Bottles</option>
<option value="Bags">Bags</option>
<option value="Pairs">Pairs</option>
<option value="Containers">Containers</option>
<option value="Reams">Reams</option>

</select>

</div>



<div class="form-group">

<label>
Minimum Stock Level
</label>

<input
type="number"
id="itemMinimum"
min="0"
value="5">

</div>



<div class="form-buttons">

<button
class="cancel-button"
onclick="closeItemForm()">

Cancel

</button>


<button
class="save-button"
onclick="saveItem()">

Save Item

</button>

</div>


</div>
</div>



<script>


/* =========================
   API
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbz2ZxwkqDPf4WkjTvBwEZk5f9zFdrdO6kZQgNyDvZjLY3kdQ3R1O90cplsdK-qKly6D7g/exec";



/* =========================
   STORAGE KEYS
========================= */

const INVENTORY_CACHE_KEY =
"facilityInventoryShared";

const PENDING_KEY =
"facilityInventoryPending";



/* =========================
   DATA
========================= */

let inventory = [];

let serverInventory = [];

let pendingActions = [];

let selectedCategory = "All";

let editingId = null;

let currentlySyncing = false;



/* =========================
   UNIQUE ID
========================= */

function createId(prefix) {

    let randomId;

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        randomId =
        crypto.randomUUID();

    }

    else {

        randomId =
        Date.now().toString(36) +
        Math.random()
        .toString(36)
        .substring(2);

    }


    return (
        prefix +
        "-" +
        randomId
    );

}



/* =========================
   CATEGORY CLASS
========================= */

function categoryClass(category) {

    if (category === "Safety")
        return "safety";

    if (category === "Cleaning")
        return "cleaning";

    if (category === "Office")
        return "office";

    if (category === "Fitness Equipment")
        return "fitness";

    if (category === "Facility")
        return "facility";

    if (category === "FAC")
        return "fac";

    return "other";

}



/* =========================
   LOCAL STORAGE
========================= */

function loadLocalData() {

    try {

        inventory =
        JSON.parse(
            localStorage.getItem(
                INVENTORY_CACHE_KEY
            )
        ) || [];

    }

    catch {

        inventory = [];

    }


    try {

        pendingActions =
        JSON.parse(
            localStorage.getItem(
                PENDING_KEY
            )
        ) || [];

    }

    catch {

        pendingActions = [];

    }

}



function saveInventoryCache() {

    localStorage.setItem(

        INVENTORY_CACHE_KEY,

        JSON.stringify(
            inventory
        )

    );

}



function savePending() {

    localStorage.setItem(

        PENDING_KEY,

        JSON.stringify(
            pendingActions
        )

    );

}



/* =========================
   STATUS
========================= */

function setStatus(
className,
text
) {

    const status =
    document.getElementById(
        "syncStatus"
    );


    status.className =
    "sync-status " +
    className;


    status.textContent =
    text;

}



function updateStatus() {

    if (currentlySyncing) {

        setStatus(
            "syncing",
            "Syncing..."
        );

        return;

    }


    if (
        pendingActions.length > 0
    ) {

        const count =
        pendingActions.length;


        setStatus(

            "pending",

            count +
            (
                count === 1
                ? " change waiting to sync"
                : " changes waiting to sync"
            )

        );

        return;

    }


    setStatus(
        "synced",
        "● Synced"
    );

}



/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    document
    .getElementById(
        "message"
    )
    .textContent =
    text;


    setTimeout(

        () => {

            document
            .getElementById(
                "message"
            )
            .textContent =
            "";

        },

        3000

    );

}



/* =========================
   SELECT CATEGORY
========================= */

function selectCategory(
category,
button
) {

    selectedCategory =
    category;


    document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.classList.remove(
            "active"
        );

    });


    button
    .classList
    .add("active");


    displayInventory();

}



/* =========================
   DISPLAY
========================= */

function displayInventory() {

    const list =
    document.getElementById(
        "inventoryList"
    );


    const search =
    document
    .getElementById(
        "search"
    )
    .value
    .toLowerCase();


    list.innerHTML = "";


    let visibleItems = 0;


/* =========================
   SORT INVENTORY
========================= */

const sortOption =
document.getElementById("sortInventory").value;

const categoryOrder = [
    "Safety",
    "Cleaning",
    "Office",
    "Fitness Equipment",
    "Facility",
    "FAC",
    "Other"
];

const sortedInventory = [...inventory];

if (sortOption === "category") {

    sortedInventory.sort((a, b) => {

        const categoryDifference =
        categoryOrder.indexOf(a.category) -
        categoryOrder.indexOf(b.category);

        if (categoryDifference !== 0) {
            return categoryDifference;
        }

        return String(a.name).localeCompare(
            String(b.name)
        );

    });

}

else if (sortOption === "low") {

    sortedInventory.sort((a, b) =>
        Number(a.quantity) - Number(b.quantity)
    );

}

else if (sortOption === "high") {

    sortedInventory.sort((a, b) =>
        Number(b.quantity) - Number(a.quantity)
    );

}


sortedInventory.forEach(

    item => {


            if (

                selectedCategory !== "All"

                &&

                item.category !==
                selectedCategory

            ) {

                return;

            }


            if (

                !String(item.name)
                .toLowerCase()
                .includes(search)

                &&

                !String(item.category)
                .toLowerCase()
                .includes(search)

            ) {

                return;

            }


            visibleItems++;


            const isLow =
            Number(item.quantity)
            <=
            Number(item.minimum);


            const colorClass =
            categoryClass(
                item.category
            );


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "item-card card-" +
            colorClass;


            card.innerHTML = `

            <div class="item-top">

                <div>

                    <div class="item-name">
                        ${escapeHtml(item.name)}
                    </div>

                    <div class="category-label">
                        ${escapeHtml(item.category)}
                    </div>

                </div>


                <div class="minimum">

                    Minimum:
                    ${Number(item.minimum)}

                </div>

            </div>


            <div class="
            status
            ${
                isLow
                ? "low-stock"
                : "in-stock"
            }
            ">

            ${
                isLow
                ? "⚠ LOW STOCK"
                : "✓ IN STOCK"
            }

            </div>


            <div class="quantity-area">


                <button
                class="quantity-button"
                onclick="
                changeQuantity(
                '${item.id}',
                -1
                )">

                −

                </button>


                <div class="quantity">

                    ${Number(item.quantity)}

                    <span class="unit">
                        ${escapeHtml(item.unit)}
                    </span>

                </div>


                <button
                class="quantity-button"
                onclick="
                changeQuantity(
                '${item.id}',
                1
                )">

                +

                </button>


            </div>


            <div class="item-actions">

                <button
                class="
                small-button
                edit-button
                "
                onclick="
                openEditForm(
                '${item.id}'
                )">

                Edit

                </button>


                <button
                class="
                small-button
                delete-button
                "
                onclick="
                deleteItem(
                '${item.id}'
                )">

                Delete

                </button>

            </div>

            `;


            list.appendChild(
                card
            );

        }

    );


    if (
        visibleItems === 0
    ) {

        list.innerHTML = `

        <div class="empty-message">

        No inventory items found.

        </div>

        `;

    }


    document
    .getElementById(
        "totalItems"
    )
    .textContent =
    inventory.length;


    document
    .getElementById(
        "lowStock"
    )
    .textContent =

    inventory.filter(

        item =>
        Number(item.quantity)
        <=
        Number(item.minimum)

    ).length;


    saveInventoryCache();

}



/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(
id,
amount
) {

    const item =
    inventory.find(
        item =>
        String(item.id)
        ===
        String(id)
    );


    if (!item) {
        return;
    }


    /*
    Don't allow the local display
    below zero.
    */

    if (
        Number(item.quantity)
        + amount
        < 0
    ) {

        return;

    }


    item.quantity =
    Number(item.quantity)
    + amount;


    /*
    Store adjustment locally FIRST.
    */

    pendingActions.push({

        type:
        "adjust",

        eventId:
        createId("EVT"),

        id:
        item.id,

        change:
        amount,

        reason:
        "",

        created:
        new Date()
        .toISOString()

    });


    savePending();

    displayInventory();

    updateStatus();


    /*
    Then attempt Google sync.
    */

    syncPending();

}



/* =========================
   ADD FORM
========================= */

function openAddForm() {

    editingId = null;


    document
    .getElementById(
        "modalTitle"
    )
    .textContent =
    "Add Inventory Item";


    document
    .getElementById(
        "itemName"
    )
    .value = "";


    document
    .getElementById(
        "itemQuantity"
    )
    .value = 0;


    document
    .getElementById(
        "itemMinimum"
    )
    .value = 5;


    document
    .getElementById(
        "itemUnit"
    )
    .value =
    "Each";


    if (
        selectedCategory !==
        "All"
    ) {

        document
        .getElementById(
            "itemCategory"
        )
        .value =
        selectedCategory;

    }

    else {

        document
        .getElementById(
            "itemCategory"
        )
        .value =
        "Safety";

    }


    document
    .getElementById(
        "itemModal"
    )
    .style.display =
    "block";


    document
    .getElementById(
        "itemName"
    )
    .focus();

}



/* =========================
   EDIT FORM
========================= */

function openEditForm(id) {

    const item =
    inventory.find(
        item =>
        String(item.id)
        ===
        String(id)
    );


    if (!item) {
        return;
    }


    editingId =
    item.id;


    document
    .getElementById(
        "modalTitle"
    )
    .textContent =
    "Edit Inventory Item";


    document
    .getElementById(
        "itemName"
    )
    .value =
    item.name;


    document
    .getElementById(
        "itemCategory"
    )
    .value =
    item.category;


    document
    .getElementById(
        "itemQuantity"
    )
    .value =
    item.quantity;


    document
    .getElementById(
        "itemUnit"
    )
    .value =
    item.unit;


    document
    .getElementById(
        "itemMinimum"
    )
    .value =
    item.minimum;


    document
    .getElementById(
        "itemModal"
    )
    .style.display =
    "block";

}



/* =========================
   CLOSE FORM
========================= */

function closeItemForm() {

    document
    .getElementById(
        "itemModal"
    )
    .style.display =
    "none";


    editingId = null;

}



/* =========================
   SAVE ITEM
========================= */

function saveItem() {

    const name =
    document
    .getElementById(
        "itemName"
    )
    .value
    .trim();


    const category =
    document
    .getElementById(
        "itemCategory"
    )
    .value;


    const quantity =
    Math.max(

        0,

        parseInt(

            document
            .getElementById(
                "itemQuantity"
            )
            .value

        ) || 0

    );


    const unit =
    document
    .getElementById(
        "itemUnit"
    )
    .value;


    const minimum =
    Math.max(

        0,

        parseInt(

            document
            .getElementById(
                "itemMinimum"
            )
            .value

        ) || 0

    );


    if (!name) {

        alert(
            "Please enter an item name."
        );

        return;

    }



    /* ADD NEW ITEM */

    if (!editingId) {

        const id =
        createId("INV");


        const newItem = {

            id:
            id,

            name:
            name,

            category:
            category,

            quantity:
            quantity,

            unit:
            unit,

            minimum:
            minimum

        };


        inventory.push(
            newItem
        );


        pendingActions.push({

            type:
            "add",

            item:
            newItem,

            created:
            new Date()
            .toISOString()

        });

    }


    /* EDIT EXISTING ITEM */

    else {

        const item =
        inventory.find(
            item =>
            String(item.id)
            ===
            String(editingId)
        );


        if (!item) {
            return;
        }


        item.name =
        name;

        item.category =
        category;

        item.quantity =
        quantity;

        item.unit =
        unit;

        item.minimum =
        minimum;


        pendingActions.push({

            type:
            "edit",

            item: {
                ...item
            },

            created:
            new Date()
            .toISOString()

        });

    }


    savePending();

    saveInventoryCache();

    closeItemForm();

    displayInventory();

    updateStatus();

    syncPending();

}



/* =========================
   DELETE ITEM
========================= */

function deleteItem(id) {

    const item =
    inventory.find(
        item =>
        String(item.id)
        ===
        String(id)
    );


    if (!item) {
        return;
    }


    const confirmed =
    confirm(

        "Delete \"" +
        item.name +
        "\" from inventory?"

    );


    if (!confirmed) {
        return;
    }


    inventory =
    inventory.filter(

        current =>
        String(current.id)
        !==
        String(id)

    );


    pendingActions.push({

        type:
        "delete",

        id:
        id,

        created:
        new Date()
        .toISOString()

    });


    savePending();

    displayInventory();

    updateStatus();

    syncPending();

}



/* =========================
   SEND ACTION
========================= */

async function sendAction(
action
) {

    let payload;


    if (
        action.type ===
        "add"
    ) {

        payload = {

            action:
            "addInventoryItem",

            id:
            action.item.id,

            name:
            action.item.name,

            category:
            action.item.category,

            quantity:
            action.item.quantity,

            unit:
            action.item.unit,

            minimum:
            action.item.minimum

        };

    }


    else if (
        action.type ===
        "adjust"
    ) {

        payload = {

            action:
            "adjustInventory",

            eventId:
            action.eventId,

            id:
            action.id,

            change:
            action.change,

            reason:
            action.reason || ""

        };

    }


    else if (
        action.type ===
        "edit"
    ) {

        payload = {

            action:
            "editInventoryItem",

            id:
            action.item.id,

            name:
            action.item.name,

            category:
            action.item.category,

            quantity:
            action.item.quantity,

            unit:
            action.item.unit,

            minimum:
            action.item.minimum

        };

    }


    else if (
        action.type ===
        "delete"
    ) {

        payload = {

            action:
            "deleteInventoryItem",

            id:
            action.id

        };

    }


    else {

        throw new Error(
            "Unknown inventory action."
        );

    }


    const response =
    await fetch(

        API_URL,

        {
            method:
            "POST",

            body:
            JSON.stringify(
                payload
            )
        }

    );


    if (!response.ok) {

        throw new Error(
            "Server error."
        );

    }


    const data =
    await response.json();


    if (!data.success) {

        throw new Error(
            data.message ||
            "Unable to save."
        );

    }


    return data;

}



/* =========================
   SYNC PENDING
========================= */

async function syncPending() {

    if (currentlySyncing) {
        return;
    }


    if (
        pendingActions.length ===
        0
    ) {

        updateStatus();

        return;

    }


    currentlySyncing = true;

    updateStatus();


    const actionsToSync =
    [...pendingActions];


    try {

        for (
            const action
            of actionsToSync
        ) {

            try {

                await sendAction(
                    action
                );


                pendingActions =
                pendingActions.filter(

                    current =>
                    current !==
                    action

                );


                savePending();

            }

            catch (error) {

                console.error(
                    "Inventory sync failed:",
                    error
                );


                break;

            }

        }

    }

    finally {

        currentlySyncing =
        false;

    }


    /*
    Reload the master inventory
    after sending our changes.
    */

    await loadServerInventory();

}



/* =========================
   LOAD SERVER INVENTORY
========================= */

async function loadServerInventory() {

    try {

        const response =
        await fetch(

            API_URL +
            "?action=getInventory"

        );


        if (!response.ok) {

            throw new Error(
                "Unable to connect."
            );

        }


        const data =
        await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "Unable to load inventory."
            );

        }


        serverInventory =
        data.inventory || [];


        /*
        Start with Google's master list.
        */

        inventory =
        JSON.parse(
            JSON.stringify(
                serverInventory
            )
        );


        /*
        Reapply anything that has not
        successfully synced yet.

        This is what allows offline
        changes to survive refreshes.
        */

        applyPendingLocally();


        saveInventoryCache();

        displayInventory();

        updateStatus();

    }

    catch (error) {

        console.error(
            "Inventory server unavailable:",
            error
        );


        /*
        Keep using the locally cached
        inventory instead of clearing it.
        */

        displayInventory();


        if (
            pendingActions.length > 0
        ) {

            setStatus(

                "pending",

                pendingActions.length +
                " waiting to sync"

            );

        }

        else {

            setStatus(
                "offline",
                "● Offline"
            );

        }

    }

}



/* =========================
   APPLY PENDING LOCALLY
========================= */

function applyPendingLocally() {

    pendingActions.forEach(

        action => {


            if (
                action.type ===
                "add"
            ) {

                const exists =
                inventory.some(

                    item =>
                    String(item.id)
                    ===
                    String(
                        action.item.id
                    )

                );


                if (!exists) {

                    inventory.push({
                        ...action.item
                    });

                }

            }


            else if (
                action.type ===
                "adjust"
            ) {

                const item =
                inventory.find(

                    item =>
                    String(item.id)
                    ===
                    String(action.id)

                );


                if (item) {

                    item.quantity =
                    Math.max(

                        0,

                        Number(
                            item.quantity
                        )
                        +
                        Number(
                            action.change
                        )

                    );

                }

            }


            else if (
                action.type ===
                "edit"
            ) {

                const index =
                inventory.findIndex(

                    item =>
                    String(item.id)
                    ===
                    String(
                        action.item.id
                    )

                );


                if (index !== -1) {

                    inventory[index] = {
                        ...action.item
                    };

                }

            }


            else if (
                action.type ===
                "delete"
            ) {

                inventory =
                inventory.filter(

                    item =>
                    String(item.id)
                    !==
                    String(action.id)

                );

            }

        }

    );

}



/* =========================
   MANUAL SYNC
========================= */

async function syncEverything() {

    showMessage(
        "Checking for updates..."
    );


    await syncPending();

    await loadServerInventory();

}



/* =========================
   HTML SAFETY
========================= */

function escapeHtml(value) {

    return String(value)

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        "\"",
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}



/* =========================
   DATE
========================= */

document
.getElementById(
    "date"
)
.textContent =

new Date()
.toLocaleDateString(

    "en-US",

    {
        weekday:
        "long",

        month:
        "long",

        day:
        "numeric",

        year:
        "numeric"
    }

);



/* =========================
   AUTO SYNC
========================= */

setInterval(

    async () => {

        await syncPending();

        await loadServerInventory();

    },

    30000

);


window.addEventListener(

    "online",

    () => {

        syncEverything();

    }

);



/* =========================
   START
========================= */

loadLocalData();

displayInventory();

updateStatus();

loadServerInventory()
.then(
    () =>
    syncPending()
);


</script>
