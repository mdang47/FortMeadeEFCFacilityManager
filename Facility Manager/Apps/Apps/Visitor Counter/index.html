<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../visitor-manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="../Icons/Visitor.png">
<link rel="apple-touch-icon" href="../Icons/Visitor.png">

<title>Visitor Counter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.header {
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

.date {
    color: #666;
    margin-bottom: 12px;
}


/* SYNC STATUS */

.connection {
    text-align: center;
    margin-bottom: 18px;
    font-size: 13px;
    font-weight: bold;
}

.online {
    color: #2f7d3d;
}

.offline {
    color: #b83232;
}

.syncing {
    color: #a77e00;
}

.pending {
    color: #b36b00;
}


/* TOTAL */

.total-box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    margin-bottom: 20px;

    box-shadow:
    0 2px 7px rgba(0,0,0,.12);
}

.total-label {
    color: #666;
    font-size: 16px;
}

.total-number {
    font-size: 60px;
    font-weight: bold;
}


/* COUNTERS */

.counter-grid {
    display: grid;

    grid-template-columns:
    repeat(2, 1fr);

    gap: 12px;
}

.counter-button {
    border: none;
    border-radius: 16px;

    padding: 25px 15px;

    cursor: pointer;

    font-size: 18px;
    font-weight: bold;

    box-shadow:
    0 2px 6px rgba(0,0,0,.12);

    transition:
    transform .08s;
}

.counter-button:active {
    transform: scale(.97);
}

.button-count {
    display: block;
    font-size: 36px;
    margin-top: 8px;
}


/* COLORS */

.airforce {
    background: #a9d6f5;
}

.army {
    background: #b9d6a3;
}

.navy {
    background: #9db7df;
}

.marines {
    background: #f0a6a6;
}

.spaceforce {
    background: #c8b6e8;
}

.civilian {
    background: #f4cf8a;
}

.other {
    background: #d4d4d4;
}


/* CONTROLS */

.controls {
    display: grid;

    grid-template-columns:
    1fr 1fr;

    gap: 10px;

    margin-top: 20px;
}

.control-button {
    border: none;

    padding: 15px;

    border-radius: 10px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.undo {
    background: #e4e4e4;
}

.sync {
    background: #dbe8f6;
}


/* MESSAGE */

.message {
    min-height: 20px;

    text-align: center;

    margin-top: 15px;

    color: #666;

    font-size: 14px;
}


/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    .counter-grid {
        grid-template-columns: 1fr;
    }

    .total-number {
        font-size: 50px;
    }

}

</style>
</head>


<body>

<div class="container">


<div class="header">

<h1>Visitor Counter</h1>

<div
class="date"
id="today">
</div>

<div
class="connection syncing"
id="connectionStatus">

Loading...

</div>

</div>



<!-- TOTAL -->

<div class="total-box">

<div class="total-label">
Today's Visitors
</div>

<div
class="total-number"
id="total">

0

</div>

</div>



<!-- COUNTERS -->

<div class="counter-grid">


<button
class="counter-button airforce"
onclick="addVisitor('Air Force')">

Air Force

<span
class="button-count"
id="Air Force">
0
</span>

</button>



<button
class="counter-button army"
onclick="addVisitor('Army')">

Army

<span
class="button-count"
id="Army">
0
</span>

</button>



<button
class="counter-button navy"
onclick="addVisitor('Navy')">

Navy

<span
class="button-count"
id="Navy">
0
</span>

</button>



<button
class="counter-button marines"
onclick="addVisitor('Marines')">

Marines

<span
class="button-count"
id="Marines">
0
</span>

</button>



<button
class="counter-button spaceforce"
onclick="addVisitor('Space Force')">

Space Force

<span
class="button-count"
id="Space Force">
0
</span>

</button>



<button
class="counter-button civilian"
onclick="addVisitor('Civilian')">

Civilian

<span
class="button-count"
id="Civilian">
0
</span>

</button>



<button
class="counter-button other"
onclick="addVisitor('Other')">

Other

<span
class="button-count"
id="Other">
0
</span>

</button>


</div>



<!-- CONTROLS -->

<div class="controls">

<button
class="control-button undo"
onclick="undoLast()">

↶ Undo Last

</button>


<button
class="control-button sync"
onclick="syncEverything()">

↻ Sync Now

</button>

</div>


<div
class="message"
id="message">
</div>


</div>



<script>


/* ==========================================
   GOOGLE APPS SCRIPT
========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz2ZxwkqDPf4WkjTvBwEZk5f9zFdrdO6kZQgNyDvZjLY3kdQ3R1O90cplsdK-qKly6D7g/exec";



/* ==========================================
   LOCAL STORAGE
========================================== */

const PENDING_KEY =
"facilityPendingVisitors";



/* ==========================================
   CATEGORIES
========================================== */

const categories = [

    "Air Force",
    "Army",
    "Navy",
    "Marines",
    "Space Force",
    "Civilian",
    "Other"

];


let counts = {};

let serverVisitors = [];

let pendingVisitors = [];

let lastAction = null;

let currentlySyncing = false;



/* ==========================================
   DATE
========================================== */

document
.getElementById("today")
.textContent =

new Date()
.toLocaleDateString(

    "en-US",

    {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    }

);



/* ==========================================
   UNIQUE EVENT ID
========================================== */

function createEventId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }

    return (

        Date.now()
        .toString(36)

        +

        Math.random()
        .toString(36)
        .substring(2)

    );

}



/* ==========================================
   LOCAL STORAGE
========================================== */

function loadPending() {

    try {

        pendingVisitors =
        JSON.parse(

            localStorage.getItem(
                PENDING_KEY
            )

        ) || [];

    }

    catch {

        pendingVisitors = [];

    }

}



function savePending() {

    localStorage.setItem(

        PENDING_KEY,

        JSON.stringify(
            pendingVisitors
        )

    );

}



/* ==========================================
   COUNTS
========================================== */

function resetCounts() {

    categories.forEach(

        category => {

            counts[category] = 0;

        }

    );

}



function isToday(value) {

    const date =
    new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return false;

    }


    const today =
    new Date();


    return (

        date.getFullYear()
            ===
        today.getFullYear()

        &&

        date.getMonth()
            ===
        today.getMonth()

        &&

        date.getDate()
            ===
        today.getDate()

    );

}



/* ==========================================
   REBUILD DISPLAY
========================================== */

function calculateToday() {

    resetCounts();


    /*
    FIRST:
    Count everything confirmed
    by Google Sheets.
    */

    serverVisitors.forEach(

        entry => {

            if (
                !isToday(
                    entry.date
                )
            ) {

                return;

            }


            if (
                counts[
                    entry.category
                ]
                === undefined
            ) {

                return;

            }


            counts[
                entry.category
            ]

            +=

            Number(
                entry.change
            ) || 0;

        }

    );


    /*
    SECOND:
    Add anything stored locally
    that Google has not received yet.
    */

    pendingVisitors.forEach(

        entry => {

            if (
                !isToday(
                    entry.localTimestamp
                )
            ) {

                return;

            }


            if (
                counts[
                    entry.category
                ]
                === undefined
            ) {

                return;

            }


            counts[
                entry.category
            ]

            +=

            Number(
                entry.change
            ) || 0;

        }

    );


    updateDisplay();

    updateSyncStatus();

}



/* ==========================================
   UPDATE DISPLAY
========================================== */

function updateDisplay() {

    let total = 0;


    categories.forEach(

        category => {

            const value =
            Math.max(

                0,

                counts[
                    category
                ] || 0

            );


            document
            .getElementById(
                category
            )
            .textContent =
            value;


            total += value;

        }

    );


    document
    .getElementById(
        "total"
    )
    .textContent =
    total;

}



/* ==========================================
   STATUS
========================================== */

function setStatus(
status,
text
) {

    const element =
    document.getElementById(
        "connectionStatus"
    );


    element.className =
    "connection " +
    status;


    element.textContent =
    text;

}



function updateSyncStatus() {

    if (currentlySyncing) {

        setStatus(
            "syncing",
            "Syncing..."
        );

        return;

    }


    if (
        pendingVisitors.length > 0
    ) {

        const count =
        pendingVisitors.length;


        setStatus(

            "pending",

            count +
            (
                count === 1
                ? " change waiting to sync"
                : " changes waiting to sync"
            )

        );

        return;

    }


    setStatus(
        "online",
        "● Synced"
    );

}



/* ==========================================
   MESSAGE
========================================== */

function showMessage(text) {

    document
    .getElementById(
        "message"
    )
    .textContent =
    text;


    setTimeout(

        () => {

            document
            .getElementById(
                "message"
            )
            .textContent =
            "";

        },

        3000

    );

}



/* ==========================================
   ADD VISITOR
========================================== */

function addVisitor(category) {

    /*
    SAVE LOCALLY FIRST.

    This happens before we even
    try Google Sheets.
    */

    const event = {

        eventId:
        createEventId(),

        category:
        category,

        change:
        1,

        localTimestamp:
        new Date()
        .toISOString()

    };


    pendingVisitors.push(
        event
    );


    savePending();


    lastAction = event;


    /*
    Immediately rebuild the display
    using Google + local pending data.
    */

    calculateToday();


    /*
    Then attempt to upload it.
    We don't wait for this before
    counting the visitor.
    */

    syncPending();

}



/* ==========================================
   UNDO LAST
========================================== */

function undoLast() {

    if (!lastAction) {

        showMessage(
            "Nothing to undo on this device."
        );

        return;

    }


    /*
    We do NOT delete the original event.

    Instead we create a -1 event.

    This preserves the history.
    */

    const undoEvent = {

        eventId:
        createEventId(),

        category:
        lastAction.category,

        change:
        -1,

        localTimestamp:
        new Date()
        .toISOString()

    };


    pendingVisitors.push(
        undoEvent
    );


    savePending();


    lastAction = null;


    calculateToday();


    syncPending();

}



/* ==========================================
   SEND ONE EVENT
========================================== */

async function sendEvent(event) {

    const response =
    await fetch(

        API_URL,

        {
            method:
            "POST",

            body:
            JSON.stringify({

                action:
                "addVisitor",

                eventId:
                event.eventId,

                category:
                event.category,

                change:
                event.change

            })

        }

    );


    if (!response.ok) {

        throw new Error(
            "Server error."
        );

    }


    const data =
    await response.json();


    if (!data.success) {

        throw new Error(
            data.message ||
            "Unable to save."
        );

    }


    return true;

}



/* ==========================================
   SYNC PENDING EVENTS
========================================== */

async function syncPending() {

    if (currentlySyncing) {
        return;
    }


    if (
        pendingVisitors.length === 0
    ) {

        updateSyncStatus();

        return;

    }


    currentlySyncing = true;

    updateSyncStatus();


    /*
    Work from a COPY.

    This prevents the array from
    changing while we're syncing.
    */

    const eventsToSync =
    [...pendingVisitors];


    try {

        for (
            const event
            of eventsToSync
        ) {

            try {

                await sendEvent(
                    event
                );


                /*
                Google confirmed it.

                Remove this specific event
                from the local pending list.
                */

                pendingVisitors =
                pendingVisitors.filter(

                    item =>
                    item.eventId
                    !==
                    event.eventId

                );


                savePending();

            }

            catch (error) {

                /*
                STOP HERE.

                Keep this event and anything
                after it locally.

                We'll try again later.
                */

                console.error(
                    "Pending sync failed:",
                    error
                );

                break;

            }

        }

    }

    finally {

        currentlySyncing = false;

    }


    /*
    Now reload Google Sheets.

    IMPORTANT:
    Because successfully uploaded events
    were removed from pendingVisitors,
    they will now be counted from Google
    instead of locally.

    They are never counted twice.
    */

    await loadServerVisitors();

}



/* ==========================================
   LOAD GOOGLE SHEET
========================================== */

async function loadServerVisitors() {

    try {

        const response =
        await fetch(

            API_URL +
            "?action=getVisitors"

        );


        if (!response.ok) {

            throw new Error(
                "Unable to connect."
            );

        }


        const data =
        await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "Unable to load."
            );

        }


        serverVisitors =
        data.visitors || [];


        calculateToday();

    }

    catch (error) {

        console.error(
            "Google Sheet unavailable:",
            error
        );


        /*
        DO NOT erase anything.

        Continue displaying the last
        server data we successfully received
        + all pending local changes.
        */

        calculateToday();


        if (
            pendingVisitors.length > 0
        ) {

            setStatus(

                "pending",

                pendingVisitors.length +
                " waiting to sync"

            );

        }

        else {

            setStatus(
                "offline",
                "● Offline"
            );

        }

    }

}



/* ==========================================
   MANUAL SYNC
========================================== */

async function syncEverything() {

    showMessage(
        "Checking for updates..."
    );


    await loadServerVisitors();


    await syncPending();

}



/* ==========================================
   AUTOMATIC SYNC
========================================== */

/*
Every 30 seconds:

1. Try pending uploads.
2. Refresh shared data.

If there's no internet,
nothing gets deleted.
*/

setInterval(

    async () => {

        await syncPending();

        await loadServerVisitors();

    },

    30000

);



/*
Browser tells us internet
may have returned.
*/

window.addEventListener(

    "online",

    () => {

        syncEverything();

    }

);



/* ==========================================
   START
========================================== */

loadPending();

resetCounts();

/*
Show pending local visitors immediately.

This is important if the app was closed
while offline and reopened later.
*/

calculateToday();


/*
Then try Google.
*/

loadServerVisitors()
.then(
    () => syncPending()
);


</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("../service-worker.js")
        .then(() => console.log("Service worker registered"))
        .catch(error => console.error("Service worker registration failed:", error));
    });
  }
</script>
</body>

</html>
