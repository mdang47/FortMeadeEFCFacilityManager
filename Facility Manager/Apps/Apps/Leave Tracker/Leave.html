<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../leave-manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="../Icons/Leave.png">
<link rel="apple-touch-icon" href="../Icons/Leave.png">

<title>Leave Tracker</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.header {
    text-align: center;
}

h1 {
    margin-bottom: 5px;
}

.date {
    color: #666;
}

.sync-status {
    margin-top: 8px;
    font-size: 13px;
    font-weight: bold;
}

.synced { color: #26834a; }
.syncing { color: #a77e00; }
.pending { color: #b36b00; }
.offline { color: #c43d3d; }


/* SUMMARY */

.summary {
    max-width: 1000px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.summary-box {
    background: white;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.summary-number {
    font-size: 30px;
    font-weight: bold;
}

.summary-label {
    font-size: 13px;
    color: #666;
}


/* NEW REQUEST */

.new-request {
    display: block;
    width: 100%;
    max-width: 1000px;
    margin: 15px auto;
    padding: 17px;
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}


/* VIEW SWITCHER */

.view-switcher {
    max-width: 1000px;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.view-button {
    border: 2px solid #333;
    padding: 11px 22px;
    border-radius: 20px;
    background: white;
    font-weight: bold;
    cursor: pointer;
}

.view-button.active {
    background: #333;
    color: white;
}


/* SEARCH */

.search-container {
    max-width: 1000px;
    margin: 15px auto;
}

#search {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
}


/* FILTERS */

.tabs {
    max-width: 1000px;
    margin: 15px auto 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
}

.tab {
    border: 2px solid transparent;
    padding: 10px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.tab-all { background: #ddd; }
.tab-pending { background: #f5e4a8; }
.tab-approved { background: #bfe1c4; }
.tab-denied { background: #f2b6b6; }
.tab-cancelled { background: #d2d2d2; }

.tab.active {
    border-color: #333;
}


/* LIST */

.request-list {
    max-width: 1000px;
    margin: auto;
}

.request-card {
    background: white;
    padding: 20px;
    margin-bottom: 12px;
    border-radius: 15px;
    border-left: 8px solid #aaa;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.card-pending { border-left-color: #d4ad2f; }
.card-approved { border-left-color: #4f9b60; }
.card-denied { border-left-color: #c95050; }
.card-cancelled { border-left-color: #888; }

.request-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.person-name {
    font-size: 21px;
    font-weight: bold;
}

.leave-type {
    color: #666;
    margin-top: 3px;
}

.status {
    font-weight: bold;
}

.status-pending { color: #a77e00; }
.status-approved { color: #28773c; }
.status-denied { color: #b52f2f; }
.status-cancelled { color: #666; }

.leave-dates {
    margin-top: 15px;
    padding: 12px;
    background: #f7f7f7;
    border-radius: 10px;
}

.days {
    font-weight: bold;
    margin-top: 5px;
}

.notes {
    margin-top: 12px;
    color: #555;
}

.submitted {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
}


/* ACTIONS */

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 15px;
}

.action-button {
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.approve { background: #cce8d2; }
.deny { background: #f4caca; }
.edit { background: #d9e5f5; }
.cancel-request { background: #e1e1e1; }

.delete {
    background: #b83232;
    color: white;
}


/* SYNC BUTTON */

.sync-area {
    max-width: 1000px;
    margin: 15px auto;
    text-align: center;
}

.sync-button {
    border: none;
    background: #dbe8f6;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}


/* CALENDAR */

#calendarView {
    display: none;
    max-width: 1200px;
    margin: auto;
}

.calendar-header {
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px;
    border-radius: 15px 15px 0 0;
}

.calendar-title {
    font-size: 24px;
    font-weight: bold;
}

.month-button {
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #e7e7e7;
    font-size: 24px;
    cursor: pointer;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #ccc;
    gap: 1px;
    border: 1px solid #ccc;
}

.weekday {
    background: #333;
    color: white;
    padding: 10px 4px;
    text-align: center;
    font-weight: bold;
}

.calendar-day {
    background: white;
    min-height: 130px;
    padding: 7px;
    overflow: hidden;
}

.calendar-day.other-month {
    background: #f0f0f0;
    color: #aaa;
}

.calendar-day.today {
    box-shadow: inset 0 0 0 3px #333;
}

.day-number {
    font-weight: bold;
    margin-bottom: 6px;
}

.calendar-event {
    padding: 5px 6px;
    border-radius: 5px;
    margin-bottom: 4px;
    font-size: 12px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.event-approved {
    background: #bfe1c4;
    color: #174f25;
}

.event-pending {
    background: #f5e4a8;
    color: #725700;
}

.event-denied {
    background: #f2b6b6;
    color: #842929;
}

.event-cancelled {
    background: #ddd;
    color: #666;
    text-decoration: line-through;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    background: white;
    padding: 15px;
    border-radius: 0 0 15px 15px;
    margin-bottom: 20px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
}

.legend-color {
    width: 16px;
    height: 16px;
    border-radius: 4px;
}

.legend-approved { background: #bfe1c4; }
.legend-pending { background: #f5e4a8; }
.legend-denied { background: #f2b6b6; }
.legend-cancelled { background: #ddd; }


/* EMPTY */

.empty {
    background: white;
    text-align: center;
    padding: 35px;
    color: #777;
    border-radius: 15px;
}


/* MODALS */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,.5);
    padding: 20px;
    overflow-y: auto;
}

.modal-content {
    background: white;
    max-width: 550px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

.modal-content h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.calculated-days {
    background: #f1f1f1;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 15px;
}

.form-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.form-button {
    border: none;
    padding: 14px;
    border-radius: 9px;
    font-size: 16px;
    cursor: pointer;
}

.close { background: #ddd; }

.save {
    background: #333;
    color: white;
}


/* DETAILS */

.detail-row {
    margin-bottom: 12px;
}

.detail-label {
    font-size: 12px;
    color: #777;
    text-transform: uppercase;
    font-weight: bold;
}

.detail-value {
    margin-top: 3px;
    font-size: 17px;
}


/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 10px;
    }

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .date-row {
        grid-template-columns: 1fr;
    }

    .request-top {
        flex-direction: column;
    }

    .calendar-day {
        min-height: 90px;
        padding: 4px;
    }

    .weekday {
        font-size: 11px;
    }

    .calendar-event {
        font-size: 10px;
        padding: 4px;
    }

    .calendar-title {
        font-size: 19px;
    }

}

</style>
</head>


<body>


<div class="header">

<h1>Leave Request Tracker</h1>

<div class="date" id="today"></div>

<div
class="sync-status syncing"
id="syncStatus">
Loading...
</div>

</div>


<div class="summary">

<div class="summary-box">
<div class="summary-number" id="pendingCount">0</div>
<div class="summary-label">Pending</div>
</div>

<div class="summary-box">
<div class="summary-number" id="approvedCount">0</div>
<div class="summary-label">Approved</div>
</div>

<div class="summary-box">
<div class="summary-number" id="deniedCount">0</div>
<div class="summary-label">Denied</div>
</div>

<div class="summary-box">
<div class="summary-number" id="totalCount">0</div>
<div class="summary-label">Total Requests</div>
</div>

</div>


<button
class="new-request"
onclick="openNewRequest()">
+ New Leave Request
</button>


<div class="sync-area">

<button
class="sync-button"
onclick="syncEverything()">
↻ Sync Now
</button>

</div>


<div class="view-switcher">

<button
id="listButton"
class="view-button active"
onclick="switchView('list')">
☰ List View
</button>

<button
id="calendarButton"
class="view-button"
onclick="switchView('calendar')">
▦ Calendar View
</button>

</div>



<div id="listView">


<div class="search-container">

<input
type="text"
id="search"
placeholder="🔎 Search by name..."
oninput="displayRequests()">

</div>


<div class="tabs">

<button
class="tab tab-all active"
onclick="filterStatus('All', this)">
All
</button>

<button
class="tab tab-pending"
onclick="filterStatus('Pending', this)">
Pending
</button>

<button
class="tab tab-approved"
onclick="filterStatus('Approved', this)">
Approved
</button>

<button
class="tab tab-denied"
onclick="filterStatus('Denied', this)">
Denied
</button>

<button
class="tab tab-cancelled"
onclick="filterStatus('Cancelled', this)">
Cancelled
</button>

</div>


<div
class="request-list"
id="requestList">
</div>

</div>



<div id="calendarView">


<div class="calendar-header">

<button
class="month-button"
onclick="previousMonth()">
‹
</button>

<div
class="calendar-title"
id="calendarTitle">
</div>

<button
class="month-button"
onclick="nextMonth()">
›
</button>

</div>


<div
class="calendar"
id="calendar">
</div>


<div class="legend">

<div class="legend-item">
<span class="legend-color legend-approved"></span>
Approved
</div>

<div class="legend-item">
<span class="legend-color legend-pending"></span>
Pending
</div>

<div class="legend-item">
<span class="legend-color legend-denied"></span>
Denied
</div>

<div class="legend-item">
<span class="legend-color legend-cancelled"></span>
Cancelled
</div>

</div>

</div>



<!-- REQUEST FORM -->

<div
class="modal"
id="requestModal">

<div class="modal-content">

<h2 id="formTitle">
New Leave Request
</h2>


<div class="form-group">

<label>Name</label>

<input
type="text"
id="employeeName"
placeholder="Enter name">

</div>


<div class="form-group">

<label>Leave Type</label>

<select id="leaveType">

<option>Annual Leave</option>
<option>Medical</option>
<option>Convalescent</option>
<option>Emergency Leave</option>
<option>PTDY</option>
<option>SkillBridge</option>
<option>Other</option>

</select>

</div>


<div class="date-row">

<div class="form-group">

<label>Start Date</label>

<input
type="date"
id="startDate"
onchange="calculateDays()">

</div>

<label>End Date</label>

<input
type="date"
id="endDate"

</div>

class="calculated-days"

0 Days

class="form-button close"

Cancel
</button>

Save Request

</div>
</div>



<!-- DETAILS -->

<div
class="modal"
id="detailModal">

<div class="modal-content">

<h2>Leave Details</h2>

<div id="detailContent"></div>

<button
class="form-button close"
style="width:100%; margin-top:15px;"
onclick="closeDetails()">
Close
</button>

</div>
</div>



<script>


/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbz2ZxwkqDPf4WkjTvBwEZk5f9zFdrdO6kZQgNyDvZjLY3kdQ3R1O90cplsdK-qKly6D7g/exec";


const CACHE_KEY =
"facilityLeaveShared";

const PENDING_KEY =
"facilityLeavePending";


let requests = [];

let serverRequests = [];

let pendingActions = [];

let selectedStatus =
"All";

let editingId =
null;

let currentCalendarDate =
new Date();

let currentlySyncing =
false;



/* =========================================================
   ID
========================================================= */

function createId(prefix) {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {

        return (
            prefix +
            "-" +
            crypto.randomUUID()
        );

    }


    return (
        prefix +
        "-" +
        Date.now().toString(36) +
        Math.random()
        .toString(36)
        .substring(2)
    );

}



/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadLocalData() {

    try {

        requests =
        JSON.parse(
            localStorage.getItem(
                CACHE_KEY
            )
        ) || [];

    }

    catch {

        requests = [];

    }


    try {

        pendingActions =
        JSON.parse(
            localStorage.getItem(
                PENDING_KEY
            )
        ) || [];

    }

    catch {

        pendingActions = [];

    }

}


function saveCache() {

    localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(requests)
    );

}


function savePending() {

    localStorage.setItem(
        PENDING_KEY,
        JSON.stringify(
            pendingActions
        )
    );

}



/* =========================================================
   SYNC STATUS
========================================================= */

function setStatus(
className,
text
) {

    const element =
    document.getElementById(
        "syncStatus"
    );

    element.className =
    "sync-status " +
    className;

    element.textContent =
    text;

}


function updateSyncStatus() {

    if (currentlySyncing) {

        setStatus(
            "syncing",
            "Syncing..."
        );

        return;

    }


    if (
        pendingActions.length > 0
    ) {

        const count =
        pendingActions.length;

        setStatus(

            "pending",

            count +
            (
                count === 1
                ? " change waiting to sync"
                : " changes waiting to sync"
            )

        );

        return;

    }


    setStatus(
        "synced",
        "● Synced"
    );

}



/* =========================================================
   TODAY
========================================================= */

document
.getElementById("today")
.textContent =

new Date()
.toLocaleDateString(

    "en-US",

    {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
    }

);



/* =========================================================
   DATE HELPERS
========================================================= */

function parseLocalDate(dateString) {

    const parts =
    dateString.split("-");

    return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

}


function formatDate(dateString) {

    if (!dateString) {
        return "";
    }

    return parseLocalDate(
        dateString
    )
    .toLocaleDateString(

        "en-US",

        {
            month: "short",
            day: "numeric",
            year: "numeric"
        }

    );

}


function dateToString(date) {

    const year =
    date.getFullYear();

    const month =
    String(
        date.getMonth() + 1
    )
    .padStart(2, "0");

    const day =
    String(
        date.getDate()
    )
    .padStart(2, "0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


function getDays(
start,
end
) {

    if (!start || !end) {
        return 0;
    }

    const startDate =
    parseLocalDate(start);

    const endDate =
    parseLocalDate(end);

    if (
        endDate <
        startDate
    ) {

        return 0;

    }

    return Math.round(

        (
            endDate -
            startDate
        )

        /

        (
            1000 *
            60 *
            60 *
            24
        )

    ) + 1;

}


function calculateDays() {

    const start =
    document
    .getElementById(
        "startDate"
    )
    .value;

    const end =
    document
    .getElementById(
        "endDate"
    )
    .value;

    const days =
    getDays(
        start,
        end
    );

    document
    .getElementById(
        "daysDisplay"
    )
    .textContent =

    days +
    (
        days === 1
        ? " Day"
        : " Days"
    );

}



/* =========================================================
   VIEW
========================================================= */

function switchView(view) {

    const list =
    document.getElementById(
        "listView"
    );

    const calendar =
    document.getElementById(
        "calendarView"
    );

    const listButton =
    document.getElementById(
        "listButton"
    );

    const calendarButton =
    document.getElementById(
        "calendarButton"
    );


    if (view === "list") {

        list.style.display =
        "block";

        calendar.style.display =
        "none";

        listButton
        .classList
        .add("active");

        calendarButton
        .classList
        .remove("active");

    }

    else {

        list.style.display =
        "none";

        calendar.style.display =
        "block";

        listButton
        .classList
        .remove("active");

        calendarButton
        .classList
        .add("active");

        renderCalendar();

    }

}



/* =========================================================
   FILTER
========================================================= */

function filterStatus(
status,
button
) {

    selectedStatus =
    status;

    document
    .querySelectorAll(".tab")
    .forEach(
        tab =>
        tab.classList.remove(
            "active"
        )
    );

    button
    .classList
    .add("active");

    displayRequests();

}



/* =========================================================
   DISPLAY
========================================================= */

function displayRequests() {

    const list =
    document.getElementById(
        "requestList"
    );

    const search =
    document.getElementById(
        "search"
    )
    .value
    .toLowerCase();

    list.innerHTML = "";

    let visible = 0;


    requests.forEach(
    request => {

        if (

            selectedStatus !== "All"

            &&

            request.status !==
            selectedStatus

        ) {

            return;

        }


        if (

            !String(request.name)
            .toLowerCase()
            .includes(search)

        ) {

            return;

        }


        visible++;

        const statusClass =
        request.status
        .toLowerCase();


        const card =
        document.createElement(
            "div"
        );

        card.className =
        "request-card card-" +
        statusClass;


        let buttons = "";


        if (
            request.status ===
            "Pending"
        ) {

            buttons += `

            <button
            class="action-button approve"
            onclick="
            changeStatus(
            '${request.id}',
            'Approved'
            )">
            Approve
            </button>

            <button
            class="action-button deny"
            onclick="
            changeStatus(
            '${request.id}',
            'Denied'
            )">
            Deny
            </button>

            `;

        }


        buttons += `

        <button
        class="action-button edit"
        onclick="
        editRequest(
        '${request.id}'
        )">
        Edit
        </button>

        `;


        if (
            request.status !==
            "Cancelled"
        ) {

            buttons += `

            <button
            class="action-button cancel-request"
            onclick="
            cancelRequest(
            '${request.id}'
            )">
            Cancel Request
            </button>

            `;

        }


        buttons += `

        <button
        class="action-button delete"
        onclick="
        deleteRequest(
        '${request.id}'

/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar() {

    const calendar =
    document.getElementById(
        "calendar"
    );

    calendar.innerHTML = "";


    const year =
    currentCalendarDate
    .getFullYear();

    const month =
    currentCalendarDate
    .getMonth();


    document
    .getElementById(
        "calendarTitle"
    )
    .textContent =

    new Date(
        year,
        month,
        1
    )
    .toLocaleDateString(

        "en-US",

        {
            month: "long",
            year: "numeric"
        }

    );


    const weekdays = [
        "Sun",
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat"
    ];


    weekdays.forEach(
    day => {

        const header =
        document.createElement(
            "div"
        );

        header.className =
        "weekday";

        header.textContent =
        day;

        calendar.appendChild(
            header
        );

    });


    const firstDay =
    new Date(
        year,
        month,
        1
    );

    const startOffset =
    firstDay.getDay();

    const calendarStart =
    new Date(
        year,
        month,
        1 - startOffset
    );

    const today =
    new Date();


    for (
        let i = 0;
        i < 42;
        i++
    ) {

        const date =
        new Date(
            calendarStart
        );

        date.setDate(
            calendarStart
            .getDate() + i
        );

        const dateString =
        dateToString(date);

        const dayBox =
        document.createElement(
            "div"
        );

        dayBox.className =
        "calendar-day";


        if (
            date.getMonth()
            !== month
        ) {

            dayBox
            .classList
            .add(
                "other-month"
            );

        }


        if (

            date.getFullYear()
            === today.getFullYear()

            &&

            date.getMonth()
            === today.getMonth()

            &&

            date.getDate()
            === today.getDate()

        ) {

            dayBox
            .classList
            .add("today");

        }


        const number =
        document.createElement(
            "div"
        );

        number.className =
        "day-number";

        number.textContent =
        date.getDate();

        dayBox.appendChild(
            number
        );


        requests.forEach(
        request => {

            if (

                dateString >=
                request.start

                &&

                dateString <=
                request.end

            ) {

                const event =
                document.createElement(
                    "div"
                );

                event.className =

                "calendar-event event-" +

                request.status
                .toLowerCase();


                event.textContent =
                request.name;


                event.title =
                request.name +
                " - " +
                request.type;


                event.onclick =
                function() {

                    showDetails(
                        request.id
                    );

                };


                dayBox.appendChild(
                    event
                );

            }

        });


        calendar.appendChild(
            dayBox
        );

    }

}

/* =========================================================
   SAVE REQUEST
========================================================= */

function saveRequest() {

    const name =
    document
    .getElementById(
        "employeeName"
    )
    .value
    .trim();


    const type =
    document
    .getElementById(
        "leaveType"
    )
    .value;


    const start =
    document
    .getElementById(
        "startDate"
    )
    .value;


    const end =
    document
    .getElementById(
        "endDate"
    )
    .value;


    const notes =
    document
    .getElementById(
        "notes"
    )
    .value
    .trim();


    if (
        !name ||
        !start ||
        !end
    ) {

        alert(
            "Please enter a name, start date, and end date."
        );

        return;

    }


    const days =
    getDays(
        start,
        end
    );


    if (days === 0) {

        alert(
            "The end date cannot be before the start date."
        );

        return;

    }


    /* NEW REQUEST */

    if (!editingId) {

        const request = {

            id:
            createId("LEAVE"),

            name:
            name,

            type:
            type,

            start:
            start,

            end:
            end,

            days:
            days,

            notes:
            notes,

            status:
            "Pending",

            submitted:
            dateToString(
                new Date()
            )

        };


        requests.push(
            request
        );


        pendingActions.push({

            type:
            "add",

            request:
            {
                ...request
            }

        });

    }


    /* EDIT REQUEST */

    else {

        const request =
        requests.find(
            r =>
            String(r.id) ===
            String(editingId)
        );


        if (!request) {
            return;
        }


        request.name =
        name;

        request.type =
        type;

        request.start =
        start;

        request.end =
        end;

        request.days =
        days;

        request.notes =
        notes;


        queueUpdate(
            request
        );

    }


    savePending();

    saveCache();

    closeForm();

    refreshViews();

    updateSyncStatus();

    syncPending();

}

/* =========================================================
   DELETE
========================================================= */

function deleteRequest(id) {

    const request =
    requests.find(
        r =>
        String(r.id) ===
        String(id)
    );


    if (!request) {
        return;
    }


    const confirmed =
    confirm(

        "Permanently delete this leave request?\n\n"
        +
        request.name
        +
        "\n"
        +
        formatDate(
            request.start
        )
        +
        " - "
        +
        formatDate(
            request.end
        )
        +
        "\n\nThis cannot be undone."

    );


    if (!confirmed) {
        return;
    }


    requests =
    requests.filter(
        r =>
        String(r.id) !==
        String(id)
    );


    /*
    If the request hasn't been
    uploaded yet, remove its pending
    ADD instead of sending a DELETE
    for something Google doesn't have.
    */

    const pendingAddIndex =
    pendingActions.findIndex(

        action =>
        action.type === "add"
        &&
        String(
            action.request.id
        ) ===
        String(id)

    );


    if (
        pendingAddIndex !== -1
    ) {

        pendingActions =
        pendingActions.filter(

            action =>
            !(
                action.type === "add"
                &&
                String(
                    action.request.id
                ) ===
                String(id)
            )

        );


        pendingActions =
        pendingActions.filter(

            action =>
            !(
                action.type === "update"
                &&
                String(
                    action.request.id
                ) ===
                String(id)
            )

        );

    }

    else {

        pendingActions.push({

            type:
            "delete",

            id:
            id

        });

    }


    savePending();

    saveCache();

    refreshViews();

    updateSyncStatus();

    syncPending();

}



/* =========================================================
   QUEUE UPDATE
========================================================= */

function queueUpdate(request) {

    /*
    If this is a brand-new request
    still waiting to upload, update
    the pending ADD instead.

    That way we don't try to UPDATE
    a row that doesn't exist yet.
    */

    const pendingAdd =
    pendingActions.find(

        action =>
        action.type === "add"
        &&
        String(
            action.request.id
        ) ===
        String(request.id)

    );


    if (pendingAdd) {

        pendingAdd.request =
        {
            ...request
        };

        return;

    }


    /*
    If an update is already waiting,
    replace it with the newest version.
    */

    const pendingUpdate =
    pendingActions.find(

        action =>
        action.type === "update"
        &&
        String(
            action.request.id
        ) ===
        String(request.id)

    );


    if (pendingUpdate) {

        pendingUpdate.request =
        {
            ...request
        };

        return;

    }


    pendingActions.push({

        type:
        "update",

        request:
        {
            ...request
        }

    });

}



/* =========================================================
   SEND ACTION
========================================================= */

async function sendAction(
action
) {

    let payload;


    if (
        action.type ===
        "add"
    ) {

        payload = {

            action:
            "addLeave",

            ...action.request

        };

    }


    else if (
        action.type ===
        "update"
    ) {

        payload = {

            action:
            "updateLeave",

            ...action.request

        };

    }


    else if (
        action.type ===
        "delete"
    ) {

        payload = {

            action:
            "deleteLeave",

            id:
            action.id

        };

    }


    else {

        throw new Error(
            "Unknown leave action."
        );

    }


    const response =
    await fetch(

        API_URL,

        {
            method:
            "POST",

            body:
            JSON.stringify(
                payload
            )
        }

    );


    if (!response.ok) {

        throw new Error(
            "Server error."
        );

    }


    const data =
    await response.json();


    if (!data.success) {

        throw new Error(
            data.message ||
            "Unable to save."
        );

    }


    return data;

}



/* =========================================================
   SYNC PENDING
========================================================= */

async function syncPending() {

    if (currentlySyncing) {
        return;
    }


    if (
        pendingActions.length === 0
    ) {

        updateSyncStatus();

        return;

    }


    currentlySyncing =
    true;

    updateSyncStatus();


    const actionsToSync =
    [...pendingActions];


    try {

        for (
            const action
            of actionsToSync
        ) {

            try {

                await sendAction(
                    action
                );


                const index =
                pendingActions
                .indexOf(action);


                if (index !== -1) {

                    pendingActions
                    .splice(
                        index,
                        1
                    );

                }


                savePending();

            }

            catch (error) {

                console.error(
                    "Leave sync failed:",
                    error
                );

                break;

            }

        }

    }

    finally {

        currentlySyncing =
        false;

    }


    await loadServerRequests();

}



/* =========================================================
   LOAD GOOGLE SHEET
========================================================= */

async function loadServerRequests() {

    try {

        const response =
        await fetch(

            API_URL +
            "?action=getLeave"

        );


        if (!response.ok) {

            throw new Error(
                "Unable to connect."
            );

        }


        const data =
        await response.json();


        if (!data.success) {

            throw new Error(
                data.message ||
                "Unable to load leave."
            );

        }


        serverRequests =
        data.requests || [];


        requests =
        JSON.parse(
            JSON.stringify(
                serverRequests
            )
        );


        applyPendingLocally();


        saveCache();

        refreshViews();

        updateSyncStatus();

    }

    catch (error) {

        console.error(
            "Leave server unavailable:",
            error
        );


        refreshViews();


        if (
            pendingActions.length > 0
        ) {

            setStatus(

                "pending",

                pendingActions.length +
                " waiting to sync"

            );

        }

        else {

            setStatus(
                "offline",
                "● Offline"
            );

        }

    }

}



/* =========================================================
   APPLY OFFLINE CHANGES
========================================================= */

function applyPendingLocally() {

    pendingActions.forEach(
    action => {


        if (
            action.type ===
            "add"
        ) {

            const exists =
            requests.some(

                request =>
                String(request.id)
                ===
                String(
                    action.request.id
                )

            );


            if (!exists) {

                requests.push({
                    ...action.request
                });

            }

        }


        else if (
            action.type ===
            "update"
        ) {

            const index =
            requests.findIndex(

                request =>
                String(request.id)
                ===
                String(
                    action.request.id
                )

            );


            if (index !== -1) {

                requests[index] =
                {
                    ...action.request
                };

            }

        }


        else if (
            action.type ===
            "delete"
        ) {

            requests =
            requests.filter(

                request =>
                String(request.id)
                !==
                String(action.id)

            );

        }

    });

}



/* =========================================================
   MANUAL SYNC
========================================================= */

async function syncEverything() {

    setStatus(
        "syncing",
        "Checking for updates..."
    );


    await syncPending();

    await loadServerRequests();

}

/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value) {

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        "\"",
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}



/* =========================================================
   AUTO SYNC
========================================================= */

setInterval(

    async () => {

        await syncPending();

        await loadServerRequests();

    },

    30000

);


window.addEventListener(

    "online",

    () => {

        syncEverything();

    }

);

loadLocalData();

refreshViews();

updateSyncStatus();

loadServerRequests()
.then(

    syncPending()
