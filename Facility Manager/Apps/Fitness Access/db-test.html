<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Access DB Test</title>

<style id="efc-return-home-style">
.efc-return-home-bar { box-sizing: border-box; display: flex; justify-content: flex-start; padding: 9px 16px; background: #0b1f33; position: relative; z-index: 20; }
.efc-return-home-bar a { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; color: #fff; background: #163b61; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; font: 600 14px Arial, sans-serif; text-decoration: none; line-height: 1.2; }
.efc-return-home-bar a:hover, .efc-return-home-bar a:focus-visible { background: #2a6f9b; color: #fff; outline-offset: 2px; }
@media (max-width: 480px) { .efc-return-home-bar { padding: 7px 10px; } .efc-return-home-bar a { padding: 8px 12px; } }
</style>
</head>

<body>
<nav class="efc-return-home-bar" aria-label="Home navigation"><a href="../../../index.html">← Return Home</a></nav>


<h1>Fitness Access DB Test</h1>

<button id="testButton">Run Database Test</button>

<pre id="result">Waiting for test...</pre>

<script src="fitness-access-db.js"></script>

<script>

document.getElementById("testButton")
  .addEventListener("click", async function () {

    const output =
      document.getElementById("result");

    try {

      output.textContent =
        "Testing database...";

      const testSubmission = {
        submissionId: "TEST-OFFLINE-001",
        rank: "TEST",
        name: "John Smith",
        dodId: "0123456789",
        date: "September 28, 2026",
        initials: "JS",
        acknowledgments: {
          test: true
        },
        signature: "TEST-SIGNATURE"
      };

      await savePendingFitnessSubmission(
        testSubmission
      );

      const saved =
        await getPendingFitnessSubmission(
          "TEST-OFFLINE-001"
        );

      const count =
        await countPendingFitnessSubmissions();

      output.textContent =
        "SUCCESS!\n\n" +
        "Submission ID: " +
        saved.submissionId +
        "\n" +
        "Name: " +
        saved.name +
        "\n" +
        "Initials: " +
        saved.initials +
        "\n" +
        "Pending submissions: " +
        count;

    }

    catch (error) {

      console.error(error);

      output.textContent =
        "DATABASE TEST FAILED\n\n" +
        error.message;

    }

  });

</script>

</body>
</html>
